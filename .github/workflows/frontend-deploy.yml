name: Dev Frontend Deploy

on:
  push:
    branches:
      - dev
    paths:
      - 'frontend/**' # Only trigger if frontend code changes

jobs:
  deploy-frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./frontend 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          npm install
          npm run build # Ensure this creates a 'dist' folder

      - name: Serve with Python & PM2
        run: |
          # 1. Kill old frontend process if it exists
          pm2 delete Apti-FE || true
          
          # 2. Start Python server from the dist directory on port 3001
          pm2 start "python3 -m http.server 3001 --directory dist" --name "Apti-FE"